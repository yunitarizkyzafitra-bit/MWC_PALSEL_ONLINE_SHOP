<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONLINE SHOP - MWC PALU SELATAN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1D2128; color: #F4F2F2; padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #215E61; border-radius: 12px; margin-bottom: 30px; border-bottom: 4px solid #FF9E20; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .logo { font-size: 20px; font-weight: bold; color: #FF9E20; display: flex; align-items: center; gap: 10px; }
    .logo span { color: #F4F2F2; font-size: 16px; }
    
    .nav-menu { display: flex; gap: 20px; align-items: center; }
    .nav-item { cursor: pointer; color: #F4F2F2; font-size: 16px; font-weight: 600; text-decoration: none; padding: 6px 12px; border-radius: 6px; }
    .nav-item:hover, .nav-item.active { color: #FF9E20; background: rgba(255,158,32,0.1); }

    .indicator-badge { display: inline-block; width: 12px; height: 12px; background-color: #ef4444; border-radius: 50%; margin-left: 6px; box-shadow: 0 0 10px #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); } 50% { transform: scale(1.3); } 100% { transform: scale(0.9); } }

    .floating-cart { position: fixed; bottom: 30px; right: 30px; background: #FF9E20; color: #1D2128; padding: 14px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 158, 32, 0.4); display: flex; align-items: center; gap: 10px; z-index: 99; transition: transform 0.2s; }
    .floating-cart:hover { transform: scale(1.05); }
    .cart-count { background: #1D2128; color: #FF9E20; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
    .product-card { background: #215E61; border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); position: relative; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-5px); border-color: #FF9E20; }
    
    .card-img-container { background: #1D2128; border-radius: 12px; padding: 15px; height: 190px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .card-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    .stok-info { margin: 8px 0; font-size: 13px; font-weight: bold; }
    .stok-tersedia { color: #34d399; }
    .stok-tipis { color: #FF9E20; }
    .stok-habis { color: #f87171; }

    .btn-add-cart { width: 100%; padding: 12px; background: #FF9E20; border: none; border-radius: 8px; color: #1D2128; font-weight: bold; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
    .btn-add-cart:hover { opacity: 0.9; }
    .btn-add-cart:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
    .modal-content { background: #1D2128; padding: 25px; border-radius: 16px; width: 90%; max-width: 500px; border: 2px solid #215E61; max-height: 90vh; overflow-y: auto; color: #F4F2F2; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; padding-bottom: 10px; border-bottom: 1px solid #215E61; }
    .input-field { width: 100%; padding: 12px; margin: 8px 0; background: #215E61; border: 1px solid rgba(255,255,255,0.2); color: #F4F2F2; border-radius: 6px; outline: none; }
    .input-field::placeholder { color: #cbd5e1; }

    .order-section { background: #215E61; border-radius: 16px; padding: 20px; margin-top: 30px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
    th { color: #FF9E20; }
    .status-baru { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-store"></i> MWC PALU SELATAN <span>Toko Online</span>
    </div>
    <div class="nav-menu">
      <a class="nav-item active" onclick="showSection('katalog')">Katalog</a>
      <a class="nav-item" onclick="showSection('pesanan')">Pemesanan <span id="redIndicator" class="indicator-badge" style="display:none;"></span></a>
    </div>
  </header>

  <div class="floating-cart" onclick="toggleCartModal()">
    <i class="fa-solid fa-cart-shopping"></i> Keranjang
    <span id="cartCount" class="cart-count">0</span>
  </div>

  <!-- Katalog View -->
  <main id="katalogView">
    <div id="loading" style="text-align:center; color:#FF9E20; padding:40px;">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top:10px;">Memuat Katalog MWC Palu Selatan...</p>
    </div>
    <div id="productContainer" class="product-grid"></div>
  </main>

  <!-- Pemesanan / Admin View -->
  <section id="pesananView" class="order-section">
    <h2><i class="fa-solid fa-list-check"></i> Pesanan Masuk (Admin)</h2>
    <div id="orderTableContainer"></div>
  </section>

  <!-- Modal Checkout -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <h2 style="color:#FF9E20;"><i class="fa-solid fa-basket-shopping"></i> Keranjang Belanja</h2>
      <div id="cartList" style="margin-top: 15px;"></div>
      <h3 style="margin-top: 15px; color: #FF9E20;">Total: <span id="cartTotal">Rp 0</span></h3>
      
      <hr style="border-color: #215E61; margin: 15px 0;">
      <h4>Formulir Pemesanan Langsung:</h4>
      <input type="text" id="custName" class="input-field" placeholder="Nama Lengkap Pembeli" required>
      <input type="text" id="custPhone" class="input-field" placeholder="Nomor WhatsApp / HP" required>
      <textarea id="custAddress" class="input-field" placeholder="Alamat Pengiriman Lengkap" required></textarea>

      <button class="btn-add-cart" onclick="submitCheckout()">KIRIM PESANAN SEKARANG</button>
      <button onclick="toggleCartModal()" style="width:100%; background:transparent; color:#94a3b8; border:none; margin-top:10px; cursor:pointer;">Batal / Kembali</button>
    </div>
  </div>

  <script>
    // PASTA_KAN WEB APP URL GOOGLE APPS SCRIPT BARU HASIL DEPLOY DI SINI:
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyisbMd_DyP-toZbSr-8O5qk1yGTgWkcAYMqdTNMBrUO50pnOGfGzPle9yp4XeX41roYQ/exec";
    
    let allProducts = [];
    let cart = [];

    async function loadStoreData() {
      const loadingDiv = document.getElementById("loading");
      try {
        const response = await fetch(GAS_URL, { method: "GET", redirect: "follow" });
        if (!response.ok) throw new Error("HTTP Status " + response.status);
        
        const data = await response.json();
        allProducts = data.produk || [];

        // Update indikator merah menyala
        document.getElementById("redIndicator").style.display = data.ada_pesanan_baru ? "inline-block" : "none";

        renderProducts(allProducts);
        renderOrders(data.pesanan || []);
      } catch (err) {
        console.error("Gagal memuat data:", err);
        if (loadingDiv) {
          loadingDiv.innerHTML = `
            <div style="background:#f87171; color:#1D2128; padding:15px; border-radius:8px; display:inline-block; margin-top:20px;">
              <i class="fa-solid fa-triangle-exclamation"></i> <strong>Gagal Mengambil Data Spreadsheet!</strong><br>
              <small>Pastikan Deploy Apps Script diatur ke <b>Who has access: Anyone</b>.</small>
            </div>`;
        }
      }
    }

    function renderProducts(products) {
      const container = document.getElementById("productContainer");
      const loadingDiv = document.getElementById("loading");
      if (loadingDiv) loadingDiv.style.display = "none";
      container.innerHTML = "";

      if (!products || products.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#94a3b8;'>Belum ada produk di Spreadsheet.</p>";
        return;
      }

      products.forEach(p => {
        const stok = Number(p.stok || 0);
        let stokClass = stok > 5 ? "stok-tersedia" : (stok > 0 ? "stok-tipis" : "stok-habis");
        let stokText = stok > 0 ? `Sisa Stok: ${stok} unit` : "STOK HABIS";
        let disabledAttr = stok <= 0 ? "disabled" : "";
        let imgUrl = p.url_foto || "https://via.placeholder.com/200?text=Foto+Produk";

        container.innerHTML += `
          <div class="product-card">
            <div class="card-img-container">
              <img src="${imgUrl}" alt="${p.nama_produk}" onerror="this.src='https://via.placeholder.com/200?text=Gambar+Drive+Error'">
            </div>
            <h3 style="margin-top:12px; color:#F4F2F2;">${p.nama_produk || 'Produk'}</h3>
            <div class="stok-info ${stokClass}">${stokText}</div>
            <p style="color:#FF9E20; font-size:18px; font-weight:bold;">Rp ${Number(p.harga || 0).toLocaleString('id-ID')}</p>
            <button class="btn-add-cart" ${disabledAttr} onclick="addToCart('${p.nama_produk}', ${p.harga}, ${stok})">
              ${stok > 0 ? '+ Tambah ke Keranjang' : 'Stok Habis'}
            </button>
          </div>
        `;
      });
    }

    function renderOrders(orders) {
      const container = document.getElementById("orderTableContainer");
      if (!orders || orders.length === 0) {
        container.innerHTML = "<p style='color:#94a3b8;'>Belum ada pesanan masuk.</p>";
        return;
      }

      let html = `<table><thead><tr><th>Waktu</th><th>ID Pesanan</th><th>Nama</th><th>No. HP</th><th>Total</th><th>Status</th></tr></thead><tbody>`;
      orders.forEach(o => {
        const isBaru = String(o.status_pesanan).toUpperCase() === 'BARU';
        html += `
          <tr>
            <td>${o.waktu_pesanan || '-'}</td>
            <td>${o.id_pesanan || '-'}</td>
            <td>${o.nama_pembeli || '-'}</td>
            <td>${o.no_telepon || '-'}</td>
            <td>Rp ${Number(o.total_bayar || 0).toLocaleString('id-ID')}</td>
            <td class="${isBaru ? 'status-baru' : ''}">${isBaru ? '🔴 BARU' : o.status_pesanan}</td>
          </tr>
        `;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function addToCart(name, price, maxStock) {
      let item = cart.find(i => i.nama === name);
      let currentQty = item ? item.qty : 0;

      if (currentQty + 1 > maxStock) {
        alert(`⚠️ Stok tidak mencukupi! Sisa stok hanya ${maxStock} unit.`);
        return;
      }

      if (item) {
        item.qty += 1;
      } else {
        cart.push({ nama: name, harga: price, qty: 1, maxStok: maxStock });
      }

      updateCartUI();
      alert(`✅ ${name} berhasil masuk keranjang!`);
    }

    function updateCartUI() {
      let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      let totalPrice = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);

      document.getElementById("cartCount").innerText = totalItems;
      document.getElementById("cartTotal").innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;

      let cartList = document.getElementById("cartList");
      if (cart.length === 0) {
        cartList.innerHTML = "<p style='color:#94a3b8;'>Keranjang masih kosong.</p>";
        return;
      }

      cartList.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.nama}</strong><br>
            <small style="color:#FF9E20;">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</small>
          </div>
          <div>
            <button onclick="changeQty('${item.nama}', -1)" style="padding:2px 8px; background:#215E61; color:white; border:none; border-radius:4px; cursor:pointer;">-</button>
            <span style="margin:0 8px; font-weight:bold;">${item.qty}</span>
            <button onclick="changeQty('${item.nama}', 1)" style="padding:2px 8px; background:#215E61; color:white; border:none; border-radius:4px; cursor:pointer;">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(name, change) {
      let item = cart.find(i => i.nama === name);
      if (!item) return;

      if (change > 0 && item.qty + 1 > item.maxStok) {
        alert(`⚠️ Stok maksimal tercapai (${item.maxStok} unit).`);
        return;
      }

      item.qty += change;
      if (item.qty <= 0) cart = cart.filter(i => i.nama !== name);
      updateCartUI();
    }

    function toggleCartModal() {
      const modal = document.getElementById("cartModal");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    // Fungsi Perpindahan Navigasi Menu
    function showSection(section) {
      const katalogView = document.getElementById("katalogView");
      const pesananView = document.getElementById("pesananView");
      const navItems = document.querySelectorAll(".nav-item");

      if (section === 'katalog') {
        katalogView.style.display = "block";
        pesananView.style.display = "none";
        navItems[0].classList.add("active");
        navItems[1].classList.remove("active");
      } else {
        katalogView.style.display = "none";
        pesananView.style.display = "block";
        navItems[0].classList.remove("active");
        navItems[1].classList.add("active");
      }
    }

    async function submitCheckout() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();

      if (!name || !phone || !address) {
        alert("⚠️ Mohon isi Nama, Nomor HP/WhatsApp, dan Alamat Pengiriman.");
        return;
      }

      if (cart.length === 0) {
        alert("⚠️ Keranjang belanja Anda masih kosong.");
        return;
      }

      const totalPrice = cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const payload = { nama: name, telepon: phone, alamat: address, items: cart, total: totalPrice };

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const res = await response.json();
        if (res.result === "success") {
          alert("🎉 Pesanan MWC Palu Selatan berhasil dikirim! ID Pesanan: " + res.orderId);
          cart = [];
          updateCartUI();
          toggleCartModal();
          loadStoreData();
        }
      } catch (err) {
        alert("❌ Terjadi kesalahan saat mengirim pesanan.");
      }
    }

    // Jalankan pertama kali
    loadStoreData();
    setInterval(loadStoreData, 30000);
  </script>
</body>
</html>
